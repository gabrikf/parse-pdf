# Real Redis and SeaweedFS for the backend integration tests (pytest), on loopback ports.
#   docker compose -f compose.test.yaml up -d --wait
name: parse-pdf-test

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  storage:
    image: chrislusf/seaweedfs:4.54
    entrypoint: ["/bin/sh", "/opt/storage/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: test-access
      S3_SECRET_KEY: test-secret-key
    ports:
      - "127.0.0.1:58333:8333"
    volumes:
      - ./deploy/storage/entrypoint.sh:/opt/storage/entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 60
